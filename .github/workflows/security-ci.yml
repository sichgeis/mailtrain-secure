name: Security CI

on:
  pull_request:
  push:
    branches:
      - v2

permissions:
  contents: read

concurrency:
  group: security-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24.20.0'
  ALLOW_DESTRUCTIVE_TESTS: YES_I_AM_USING_SYNTHETIC_DATA

jobs:
  fast-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            shared/package-lock.json
            zone-mta/package-lock.json
      - name: Verify the pinned JavaScript toolchain
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "11.19.0"
      - name: Install server dependencies deterministically
        working-directory: server
        run: npm ci
      - name: Install shared runtime dependencies
        working-directory: shared
        run: npm ci --omit=dev
      - name: Install and test built-in ZoneMTA
        working-directory: zone-mta
        run: |
          npm ci --omit=dev
          npm test
      - name: Run fast unit and security tests with coverage
        working-directory: server
        run: |
          npm run lint:harness
          npm run test:fast
          npm run test:coverage
      - name: Install client dependencies deterministically
        working-directory: client
        run: npm ci
      - name: Build browser assets
        working-directory: client
        run: npm run build
      - name: Build and inspect hardened production image
        run: |
          docker build --tag mailtrain-security-ci:${{ github.sha }} .
          docker image inspect mailtrain-security-ci:${{ github.sha }} --format '{{.Id}}' > mailtrain-image-digest.txt
          test "$(docker image inspect mailtrain-security-ci:${{ github.sha }} --format '{{.Config.User}}')" = 'mailtrain:mailtrain'
          test "$(docker run --rm --entrypoint node mailtrain-security-ci:${{ github.sha }} -p 'process.getuid()+":"+process.getgid()')" = '10001:10001'
      - name: Audit server production dependencies
        if: always()
        run: set -o pipefail; npm audit --omit=dev --audit-level=high --prefix server --json | tee server-production-audit.json
      - name: Audit client production dependencies
        if: always()
        run: set -o pipefail; npm audit --omit=dev --audit-level=high --prefix client --json | tee client-production-audit.json
      - name: Audit shared production dependencies
        if: always()
        run: set -o pipefail; npm audit --omit=dev --audit-level=high --prefix shared --json | tee shared-production-audit.json
      - name: Audit ZoneMTA production dependencies
        if: always()
        run: set -o pipefail; npm audit --omit=dev --audit-level=high --prefix zone-mta --json | tee zone-mta-production-audit.json
      - name: Emit SPDX software bill of materials
        if: always()
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638
        with:
          image: mailtrain-security-ci:${{ github.sha }}
          format: spdx-json
          output-file: mailtrain-sbom.spdx.json
          artifact-name: mailtrain-sbom.spdx.json
      - name: Scan the exact production image
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: mailtrain-security-ci:${{ github.sha }}
          version: v0.74.0
          format: json
          output: trivy-results.json
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Preserve dependency audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-dependency-audits
          path: |
            server-production-audit.json
            client-production-audit.json
            shared-production-audit.json
            zone-mta-production-audit.json
            mailtrain-sbom.spdx.json
            trivy-results.json
            mailtrain-image-digest.txt
          if-no-files-found: warn
      - name: Preserve coverage on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: fast-build-diagnostics
          path: |
            server/coverage
            client/dist
          if-no-files-found: ignore

  database-integration:
    strategy:
      fail-fast: false
      matrix:
        database:
          - name: mariadb-10.11
            image: mariadb:10.11@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
          - name: mysql-8.4
            image: mysql:8.4@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      database:
        image: ${{ matrix.database.image }}
        env:
          MYSQL_ROOT_PASSWORD: synthetic-root-password
          MYSQL_DATABASE: mailtrain_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6
    env:
      NODE_ENV: test
      NODE_CONFIG: '{"mysql":{"host":"127.0.0.1","user":"root","password":"synthetic-root-password","database":"mailtrain_ci_test","port":3306}}'
      MAILTRAIN_MASTER_KEY: 'MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY='
      MAILTRAIN_MASTER_KEY_ID: synthetic-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Clean server install
        working-directory: server
        run: npm ci
      - name: Install shared runtime dependencies
        working-directory: shared
        run: npm ci --omit=dev
      - name: Initialize the synthetic legacy fixture
        working-directory: server
        run: npm run sqlinit
      - name: Apply and verify migrations
        working-directory: server
        run: |
          npm run test:integration
          node test/integration/webhook-delivery-ledger-smoke.js
          node test/integration/secret-migration-smoke.js seed
          node test/integration/secret-migration-smoke.js compatibility
          npm run security:secrets -- dry-run
          npm run security:secrets -- migrate
          npm run security:secrets -- verify
          node test/integration/secret-migration-smoke.js verify
          npm run security:secrets -- migrate
          npm run security:secrets -- verify
          node test/integration/secret-migration-smoke.js verify
      - name: Preserve database diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: database-${{ matrix.database.name }}-diagnostics
          path: server/npm-debug.log
          if-no-files-found: ignore

  zone-mta-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7@sha256:b6421fd6d1c5ded6377b397d8983e2f82e2100dc5123332dcfda2065a472be5b
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'quit(db.runCommand({ping:1}).ok ? 0 : 2)'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=6
    env:
      ZONE_MTA_INTEGRATION: '1'
      ZONE_MTA_MONGO_URL: mongodb://127.0.0.1:27017/zone-mta-integration
      ZONE_MTA_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: zone-mta/package-lock.json
      - name: Install and exercise the real ZoneMTA process
        working-directory: zone-mta
        run: |
          npm ci --omit=dev
          npm test
      - name: Preserve ZoneMTA diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zone-mta-diagnostics
          path: zone-mta/*.log
          if-no-files-found: ignore

  playwright-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      database:
        image: mariadb:10.11@sha256:ce66c7be32a03aabe7241d0a10993a2db827ef652a35d25727d92a832ac8ef73
        env:
          MYSQL_ROOT_PASSWORD: synthetic-root-password
          MYSQL_DATABASE: mailtrain_ci_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psynthetic-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
      redis:
        image: redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
        ports:
          - 6379:6379
    env:
      NODE_ENV: test
      NODE_CONFIG: '{"mysql":{"host":"127.0.0.1","user":"root","password":"synthetic-root-password","database":"mailtrain_ci_test","port":3306}}'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
            shared/package-lock.json
            zone-mta/package-lock.json
      - name: Install application dependencies
        run: |
          npm ci --prefix server
          npm ci --prefix client
          npm ci --omit=dev --prefix shared
          npm ci --omit=dev --prefix zone-mta
      - name: Build client
        run: npm run build --prefix client
      - name: Install Playwright Chromium
        working-directory: server
        run: npx --no-install playwright install --with-deps chromium
      - name: Install the production image-processing runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends imagemagick
      - name: Initialize synthetic database
        working-directory: server
        run: npm run sqlinit
      - name: Start Mailtrain test application
        run: |
          npm run starttest --prefix server > mailtrain-test.log 2>&1 &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:3000/login >/dev/null && exit 0
            sleep 2
          done
          tail -200 mailtrain-test.log
          exit 1
      - name: Run Playwright origin and login smoke tests
        working-directory: server
        run: npm run test:playwright
      - name: Preserve browser and application diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-diagnostics
          path: |
            mailtrain-test.log
            server/test/playwright/playwright-report
            server/test/playwright/test-results
          if-no-files-found: ignore
